[project]
name = "rag-chatbot-pp-mf"
version = "0.1.0"
description = "Facts-only RAG assistant for PPFAS mutual fund schemes on Groww"
readme = "README.md"
requires-python = ">=3.13"
# Runtime only: what the Streamlit app imports. Streamlit Community Cloud installs from uv.lock,
# so anything here is installed on every deploy. Offline/experiment tools live in groups below.
dependencies = [
    "faiss-cpu>=1.13.1",
    "langchain-community>=0.4.1",
    "langchain-openai>=1.1.3",
    "nltk>=3.9.2",
    "python-dotenv>=1.2.1",
    "rank-bm25>=0.2.2",
    "streamlit>=1.65.0",
    "tiktoken>=0.12.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
# Offline data pipeline: crawling, extraction, chunking  (uv sync --group ingest)
ingest = [
    "crawl4ai>=0.7.8",
    "playwright>=1.57.0",
    "langchain-text-splitters>=1.0.0",
    "pandas>=2.3.3",
]
# Evaluation with RAGAS  (uv sync --group eval)
eval = [
    "ragas>=0.4.3",
]
# Course notebooks and earlier experiments (archive/)  (uv sync --group learning)
learning = [
    "chromadb>=1.3.7",
    "docx2txt>=0.9",
    "huggingface-hub>=0.36.0",
    "ipykernel>=7.1.0",
    "jq>=1.10.0",
    "langchain>=1.1.3",
    "langchain-experimental>=0.4.1",
    "langchain-groq>=1.1.1",
    "langchain-huggingface>=1.2.0",
    "langgraph>=1.0.5",
    "matplotlib>=3.10.8",
    "openpyxl>=3.1.5",
    "pdfminer>=20191125",
    "pymupdf>=1.26.7",
    "pypdf>=6.4.1",
    "python-docx>=1.2.0",
    "sentence-transformers>=5.2.0",
    "unstructured>=0.18.21",
    "wikipedia>=1.4.0",
]
